<!DOCTYPE html>
<html>
<head><title>- AvantFAX - Edit Email Contact</title></head>
<body>
  <h1>Edit Email Contact</h1>
  <form action="/emailbook/edit" method="post">
    <label>Name</label>
    <input type="text" name="contact_name" />
    <label>Email</label>
    <input type="text" name="contact_email" />
    <input type="hidden" name="_submit_check" value="1" />
    <input type="submit" value="Save" />
  </form>
</body>
</html>
